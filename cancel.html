<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Checkout Canceled | HR Insider Playbooks</title>
  <style>
    body{
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      margin:0;
      background:#0b0b0b;
      color:#f4f4f6;
    }
    .wrap{
      max-width:900px;
      margin:0 auto;
      padding:48px 20px;
    }
    .card{
      background:#151525;
      border:1px solid #26263a;
      border-radius:16px;
      padding:28px;
      margin-top:18px;
    }
    nav{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      align-items:center;
    }
    nav a{
      color:#ff1d4d;
      text-decoration:none;
      font-weight:700;
    }
    .lang-switcher{
      display:flex;
      align-items:center;
      gap:8px;
      margin-left:auto;
      flex-wrap:wrap;
    }
    .lang-label{
      color:#ff1d4d;
      font-weight:700;
    }
    .lang-hint{
      color:#b9b9c7;
      font-size:12px;
    }
    .goog-te-gadget{
      color:#b9b9c7;
      font-size:12px;
    }
    .goog-te-gadget select{
      background:#151525;
      color:#f4f4f6;
      border:1px solid #26263a;
      border-radius:10px;
      padding:4px 8px;
      font-family:inherit;
    }
    @media (max-width:640px){
      .lang-switcher{
        width:100%;
        margin-left:0;
      }
    }
    .muted{
      color:#b9b9c7;
    }
    .btn{
      display:inline-block;
      margin-top:14px;
      background:#ff1d4d;
      color:#fff;
      padding:12px 18px;
      border-radius:10px;
      text-decoration:none;
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="/index.html">Home</a>
      <a href="/books.html">Library</a>
      <a href="/es.html">Español</a>
      <div class="lang-switcher">
        <span class="lang-label">🌐 Language</span>
        <div id="google_translate_element"></div>
        <span class="lang-hint">Translate this page</span>
      </div>
    </nav>

    <div class="card">
      <h1 style="margin-top:0">Checkout canceled</h1>
      <p class="muted">No worries — you can try again whenever you’re ready.</p>
      <a class="btn" href="/books.html">Back to the library</a>
      <p class="muted" style="margin-top:16px">
        Or jump straight to <a href="/books/fired-worker-playbook-volume-1.html" style="color:#ffd1da">Volume 1</a> or
        <a href="/books/fired-worker-playbook-volume-2.html" style="color:#ffd1da">Volume 2</a>.
      </p>
    </div>
  </div>
  <script>
    function googleTranslateElementInit() {
      const pageLang = document.documentElement.lang || "en";
      new google.translate.TranslateElement(
        { pageLanguage: pageLang, autoDisplay: false },
        "google_translate_element"
      );
    }
  </script>
  <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
